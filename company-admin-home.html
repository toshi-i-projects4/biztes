<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビズてす 企業管理者ホーム</title>
<style>
:root{--blue:#2563eb;--blue-dark:#1d4ed8;--navy:#0f172a;--line:#e5e7eb;--bg:#f5f7fb;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:#111827}
.header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;margin:0;color:var(--blue-dark)}
.header .userbox{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px}
.header .userbox a{color:var(--blue-dark);font-weight:800;text-decoration:none;font-size:13px}
.header .userbox a:hover{text-decoration:underline}
.header button{background:#111827;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer}
.wrap{max-width:880px;margin:28px auto;padding:0 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:22px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.panel h2{font-size:16px;margin:0 0 14px;color:var(--navy)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.badge.active{background:#dcfce7;color:#166534}
.badge.suspended{background:#f3f4f6;color:#6b7280}
.company-name{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px}
.company-id{font-size:12px;color:var(--muted);margin-bottom:14px}
.links{display:grid;gap:12px;grid-template-columns:1fr 1fr}
a.link-card{display:block;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--navy);font-weight:800;font-size:14px}
a.link-card:hover{background:#eff6ff;border-color:#bfdbfe}
a.link-card .sub{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:4px}
.empty{color:var(--muted);font-size:13px;padding:16px 0}
.hidden{display:none!important}
.notice-box{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.notice-box a{color:#92400e;font-weight:800}
@media(max-width:640px){.links{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <h1>ビズてす 企業管理者ホーム</h1>
  <div class="userbox"><a class="link-btn" href="operator-home.html" id="toOperatorLink" style="display:none;margin-right:6px">運営管理ページへ →</a><span id="adminEmail"></span><button id="logoutBtn">ログアウト</button></div>
</div>

<div class="wrap">
  <div class="panel" id="companyPanel">
    <h2>自社情報</h2>
    <div id="companyBody" class="empty">読み込み中…</div>
  </div>

  <div id="termsNotice" class="panel hidden"></div>

  <div class="panel" id="linksPanel">
    <h2>できること</h2>
    <div class="links" id="linkGrid"></div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let myCompanyId = "";
let myIsApplicant = false;

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }

  const caSnap = await getDoc(doc(db, "companyAdmins", user.uid));
  if (caSnap.exists() && caSnap.data().status === "active") {
    // 企業管理者としてこの画面にとどまる。
    // 運営（オペレーター）権限も併せ持つアカウントの場合は、運営管理ページへの導線を出す
    // （ビズもんと同様、ログイン直後は企業管理ページを優先し、そこから運営管理ページへ移動する）。
    document.getElementById("adminEmail").textContent = user.email;
    myCompanyId = caSnap.data().companyId;
    myIsApplicant = caSnap.data().isApplicant === true;

    const opSnap = await getDoc(doc(db, "operators", user.uid));
    if (opSnap.exists()) {
      document.getElementById("toOperatorLink").style.display = "inline";
    }

    await loadCompanyAndGate();
    return;
  }

  // 企業管理者としての登録がない場合、運営者アカウントであれば運営ホームへ案内する
  const opSnapOnly = await getDoc(doc(db, "operators", user.uid));
  if (opSnapOnly.exists()) { location.href = "operator-home.html"; return; }

  alert("この画面は企業管理者アカウントでのログインが必要です。管理者にお問い合わせください。");
  await signOut(auth);
  location.href = "login.html";
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  location.href = "login.html";
});

function escapeHtml(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function showTermsNotice(message, withLink) {
  const el = document.getElementById("termsNotice");
  el.classList.remove("hidden");
  el.innerHTML = '<h2>ご案内</h2><div class="notice-box">' + escapeHtml(message)
    + (withLink ? '<br><a href="terms-agreement.html">利用規約同意画面へ進む →</a>' : "")
    + "</div>";
}

async function loadCompanyAndGate() {
  const body = document.getElementById("companyBody");
  if (!myCompanyId) { body.textContent = "所属企業が設定されていません。運営にお問い合わせください。"; return; }
  const snap = await getDoc(doc(db, "companies", myCompanyId));
  if (!snap.exists()) { body.textContent = "所属企業の情報が見つかりません。運営にお問い合わせください。"; return; }
  const c = snap.data();
  body.innerHTML = `
    <div class="company-name">${escapeHtml(c.companyName || "")}</div>
    <div class="company-id">会社ID: ${escapeHtml(myCompanyId)}</div>
    <span class="badge ${c.status === "active" ? "active" : "suspended"}">${c.status === "active" ? "有効" : "停止中"}</span>
  `;

  const termsAccepted = c.termsAccepted === true;
  const serviceEnabled = c.serviceEnabled === true;

  if (!termsAccepted) {
    if (myIsApplicant) {
      showTermsNotice("利用開始には、利用規約への同意が必要です。まもなく利用規約同意画面に移動します。\n自動的に移動しない場合は、下のリンクからお進みください。", true);
      setTimeout(() => { location.href = "terms-agreement.html"; }, 900);
    } else {
      showTermsNotice("この企業はまだ利用を開始できません。自社の「ビズてす申込者」による利用規約同意が必要です。申込者にご確認ください。", false);
    }
    document.getElementById("linksPanel").classList.add("hidden");
    return;
  }
  if (!serviceEnabled) {
    showTermsNotice("この企業のサービス利用は現在停止されています。運営にお問い合わせください。", false);
    document.getElementById("linksPanel").classList.add("hidden");
    return;
  }

  renderLinks();
}

function renderLinks() {
  const grid = document.getElementById("linkGrid");
  const cid = encodeURIComponent(myCompanyId);
  grid.innerHTML = `
    <a class="link-card" href="operator-question-editor.html?company=${cid}">問題を編集する<span class="sub">4パートの問題内容・設定を編集します</span></a>
    <a class="link-card" href="operator-invites.html?company=${cid}">受験招待・結果を確認する<span class="sub">応募者への招待発行、受験状況・スコアを確認します</span></a>
    <a class="link-card" href="company-admin-invite.html">自社の管理者を管理する<span class="sub">自社の追加管理者を招待・無効化します</span></a>
  `;
}
</script>
</body>
</html>
