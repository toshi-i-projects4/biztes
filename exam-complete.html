<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビズてす 受験完了</title>
<style>
:root{--blue:#0369a1;--blue-dark:#075985;--navy:#0f172a;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:#f5f7fb;color:#111827;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:44px;max-width:480px;text-align:center}
.icon{width:56px;height:56px;border-radius:50%;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
h1{font-size:20px;color:var(--navy);margin:0 0 10px}
p{font-size:13.5px;color:var(--muted);line-height:1.8;margin:0 0 10px}
p:last-of-type{margin-bottom:0}
.result-link-area{margin:22px 0 6px}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;font-size:13.5px;border-radius:10px;padding:12px 22px}
.btn:hover{background:var(--blue-dark)}
.note{font-size:12px;color:#9ca3af;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>受験が完了しました</h1>
  <p>お疲れさまでした。</p>
  <div id="resultLinkArea" class="result-link-area" style="display:none">
    <a id="resultLink" class="btn" href="#">ご自身の回答の傾向を見る</a>
  </div>
  <p class="note">このままブラウザを閉じていただいて構いません。</p>
</div>
<script>
// 受験直後の同じブラウザにだけ残っている biztest_company / biztest_token
// （exam-entry.htmlで設定、sessionStorageなのでタブを閉じると消える）が
// 両方そろっている場合だけ、本人向け結果ページ（exam-result.html）への
// リンクを表示する。これらが無い状態でこのページに直接アクセスした場合
// （例：ブックマーク経由）はリンクを出さない。
(function () {
  try {
    var companyId = sessionStorage.getItem("biztest_company");
    var token = sessionStorage.getItem("biztest_token");
    if (!companyId || !token) return;
    var link = document.getElementById("resultLink");
    link.href = "exam-result.html?company=" + encodeURIComponent(companyId) + "&token=" + encodeURIComponent(token);
    document.getElementById("resultLinkArea").style.display = "block";
  } catch (e) {
    // sessionStorageが使えない環境（プライベートブラウズ等）では黙ってリンクを出さない
  }
})();
</script>
</body>
</html>
