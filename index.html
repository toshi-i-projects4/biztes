<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビズてす</title>
<style>
:root{--blue:#2563eb;--blue-dark:#1d4ed8;--navy:#0f172a;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 48%,#38bdf8 100%);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);border-radius:24px;padding:44px;max-width:480px;width:100%;text-align:center;backdrop-filter:blur(6px)}
h1{font-size:26px;margin:0 0 10px}
p{font-size:14px;line-height:1.8;color:#e0ecff;margin-bottom:28px}
.links{display:grid;gap:12px}
a.btn{display:block;background:#fff;color:var(--blue-dark);border-radius:999px;padding:13px;font-weight:800;text-decoration:none;font-size:14px}
a.btn:hover{background:#eff6ff}
a.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}
.note{margin-top:24px;font-size:11.5px;color:#c7dbff}
</style>
</head>
<body>
<div class="card">
  <h1>ビズてす</h1>
  <p>ビズもんの世界観を継承した採用試験サービスです。このページは準備中のため、まずは運営者ログインからご利用ください。</p>
  <div class="links">
    <a class="btn" href="operator-login.html">運営者ログイン →</a>
  </div>
  <div class="note">応募者の方は、採用ご担当者から届いた受験リンクからアクセスしてください。</div>
</div>
</body>
</html>
