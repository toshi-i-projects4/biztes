<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビズてす</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<style>
:root{--blue:#2563eb;--blue-dark:#1d4ed8;--navy:#0f172a;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 48%,#38bdf8 100%);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.loading-box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.loading-spinner{width:42px;height:42px;border:5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
.loading-text{font-size:14px;color:#eaf2ff}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading-box">
  <div class="loading-spinner"></div>
  <div class="loading-text">ログイン状態を確認しています...</div>
</div>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ビズもんのトップページ（index.html）と同じ考え方：
// ログイン状態を確認し、未ログインならログイン画面へ、
// ログイン済みなら権限に応じたホーム画面へ自動的に遷移させる。
// （「準備中」の静的な案内カードは廃止）
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.replace("login.html");
    return;
  }
  try {
    // ログイン後の遷移優先順位は login.html と揃える
    // （企業管理者権限を優先し、なければ運営者権限を確認）
    const caSnap = await getDoc(doc(db, "companyAdmins", user.uid));
    if (caSnap.exists() && caSnap.data().status === "active") {
      location.replace("company-admin-home.html");
      return;
    }

    const opSnap = await getDoc(doc(db, "operators", user.uid));
    if (opSnap.exists()) {
      location.replace("operator-home.html");
      return;
    }

    // ログイン済みだが、運営者・企業管理者いずれの権限も確認できない場合は
    // 念のためサインアウトしてログイン画面へ戻す
    await signOut(auth);
    location.replace("login.html");
  } catch (e) {
    console.error(e);
    location.replace("login.html");
  }
});
</script>
</body>
</html>
