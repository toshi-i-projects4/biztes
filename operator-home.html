<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビズてす 運営ホーム</title>
<style>
:root{--blue:#f97316;--blue-dark:#ea580c;--navy:#0f172a;--line:#fed7aa;--bg:#fff7ed;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:#111827}
.header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;margin:0;color:var(--blue-dark)}
.header .userbox{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px}
.header button{background:#111827;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer}
.wrap{max-width:1100px;margin:28px auto;padding:0 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:22px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.panel h2{font-size:16px;margin:0 0 14px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:800;font-size:12px}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.badge.active{background:#dcfce7;color:#166534}
.badge.suspended{background:#f3f4f6;color:#6b7280}
a.link-btn{color:var(--blue-dark);font-weight:800;text-decoration:none;font-size:13px}
a.link-btn:hover{text-decoration:underline}
.row-links{display:flex;flex-direction:column;gap:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:5px}
.form-row input{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--navy);margin:10px 0 16px}
button.primary{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:13px;font-weight:800;cursor:pointer}
button.primary:hover{background:var(--blue-dark)}
.empty{color:var(--muted);font-size:13px;padding:16px 0}
.status-line{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="header">
  <h1>ビズてす 運営ホーム</h1>
  <div class="userbox"><a class="link-btn" href="company-admin-home.html" id="toCompanyAdminLink" style="display:none;margin-right:6px">企業管理ページへ →</a><a class="link-btn" href="operator-invite.html" style="margin-right:6px">運営メンバーの招待・管理 →</a><a class="link-btn" href="operator-invites.html" style="margin-right:6px">受験招待・結果一覧 →</a><span id="opEmail"></span><button id="logoutBtn">ログアウト</button></div>
</div>

<div class="wrap">
  <div class="panel">
    <h2>企業を新規登録</h2>
    <form id="companyForm">
      <div class="form-grid">
        <div class="form-row"><label>企業名</label><input id="companyName" required></div>
        <div class="form-row"><label>担当者名</label><input id="contactName"></div>
        <div class="form-row"><label>担当者メールアドレス</label><input id="contactEmail" type="email"></div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="copyTemplates" checked>
        <label for="copyTemplates">テンプレートの初期問題（リーディング11問・ロジカル20問・仕事観27項目・タイピング文例）をコピーする</label>
      </div>
      <button class="primary" type="submit">企業を登録</button>
      <div class="status-line" id="formStatus"></div>
    </form>
  </div>

  <div class="panel">
    <h2>企業一覧</h2>
    <table>
      <thead><tr><th>企業名</th><th>状態</th><th>担当者</th><th>登録日</th><th>操作</th></tr></thead>
      <tbody id="companyRows"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none">まだ企業が登録されていません。</div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  collection, addDoc, doc, getDoc, onSnapshot, serverTimestamp, query, orderBy,
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { ensureCompanyQuestionSets, copyAllTemplatesToCompany, escapeHtml } from "./operator-shared.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "operator-login.html"; return; }
  const opSnap = await getDoc(doc(db, "operators", user.uid));
  if (!opSnap.exists()) { await signOut(auth); location.href = "operator-login.html"; return; }
  document.getElementById("opEmail").textContent = user.email;

  // 運営権限に加えて企業管理者権限も持つアカウントの場合、企業管理ページへの導線を出す
  const caSnap = await getDoc(doc(db, "companyAdmins", user.uid));
  if (caSnap.exists() && caSnap.data().status === "active") {
    document.getElementById("toCompanyAdminLink").style.display = "inline";
  }

  watchCompanies();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  location.href = "operator-login.html";
});

function watchCompanies() {
  const q = query(collection(db, "companies"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snap) => {
    const rows = document.getElementById("companyRows");
    const empty = document.getElementById("emptyState");
    rows.innerHTML = "";
    if (snap.empty) { empty.style.display = "block"; return; }
    empty.style.display = "none";
    snap.forEach((d) => {
      const c = d.data();
      const tr = document.createElement("tr");
      const created = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate().toLocaleDateString("ja-JP") : "-";
      tr.innerHTML = `
        <td>${escapeHtml(c.companyName)}</td>
        <td><span class="badge ${c.status === "active" ? "active" : "suspended"}">${c.status === "active" ? "有効" : "停止中"}</span></td>
        <td>${escapeHtml(c.contactName || "-")}</td>
        <td>${created}</td>
        <td>
          <div class="row-links">
            <a class="link-btn" href="operator-question-editor.html?company=${d.id}">問題を編集 →</a>
            <a class="link-btn" href="operator-invites.html?company=${d.id}">受験招待・結果 →</a>
            <a class="link-btn" href="company-admin-invite.html?company=${d.id}">企業管理者を招待・管理 →</a>
          </div>
        </td>
      `;
      rows.appendChild(tr);
    });
  });
}

document.getElementById("companyForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("formStatus");
  status.textContent = "登録中です…";
  const companyName = document.getElementById("companyName").value.trim();
  const contactName = document.getElementById("contactName").value.trim();
  const contactEmail = document.getElementById("contactEmail").value.trim();
  const copyTemplates = document.getElementById("copyTemplates").checked;
  try {
    const ref = await addDoc(collection(db, "companies"), {
      companyName, contactName, contactEmail,
      status: "active",
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    await ensureCompanyQuestionSets(ref.id);
    if (copyTemplates) {
      const result = await copyAllTemplatesToCompany(ref.id);
      status.textContent = `登録が完了しました（テンプレート問題をコピーしました：${Object.values(result).reduce((a, b) => a + b, 0)}問）`;
    } else {
      status.textContent = "登録が完了しました。";
    }
    document.getElementById("companyForm").reset();
    document.getElementById("copyTemplates").checked = true;
  } catch (err) {
    console.error(err);
    status.textContent = "登録に失敗しました：" + err.message;
  }
});
</script>
</body>
</html>
