<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたの受験結果｜ビズてす</title>
<style>
:root{
  --blue:#0369a1;--blue-dark:#075985;--navy:#0f172a;--line:#e5e7eb;--bg:#f5f7fb;--muted:#64748b;
  --cat-1:#2a78d6;--cat-2:#008300;
  --ink-2:#52514e;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:#111827;padding:20px}
.wrap{max-width:760px;margin:0 auto}
.top-card{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:32px 34px;margin-bottom:18px}
.top-card h1{font-size:20px;color:var(--navy);margin:0 0 10px}
.top-card p{font-size:13px;color:var(--muted);line-height:1.9;margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 4px 14px rgba(15,23,42,.04);margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
.type-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.type-desc{color:var(--ink-2);font-size:12.5px;line-height:1.8}
.skill-category1{margin-bottom:8px;font-size:12.5px;line-height:1.8;color:var(--ink-2)}
.skill-category1:last-child{margin-bottom:0}
.skill-category1 b{color:var(--navy)}
.bar-section-title{font-weight:800;color:var(--navy);font-size:13px;margin-bottom:8px}
.bar-row{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:8px;margin-bottom:8px}
.bar-row .label{font-size:12px;color:var(--ink-2)}
.bar-track{background:#eef0f4;border-radius:5px;height:10px;overflow:hidden}
.bar-fill{background:var(--cat-1);height:100%;border-radius:5px}
.bar-row .val{font-size:12px;color:var(--ink-2);text-align:right}
.trait-slider-row{display:grid;grid-template-columns:112px 1fr 112px;align-items:center;gap:8px;margin-bottom:12px}
.trait-slider-row:last-child{margin-bottom:0}
.trait-slider-row .pole-label{font-size:10.5px;font-weight:700;line-height:1.3}
.trait-slider-row .pole-label.low{color:var(--blue-dark);text-align:right}
.trait-slider-row .pole-label.high{color:#92400e;text-align:left}
.trait-slider-track{position:relative;height:22px;background:#fff;border:1.5px solid var(--navy);border-radius:999px}
.trait-slider-track .mid-line{position:absolute;top:3px;bottom:3px;left:50%;width:1px;margin-left:-.5px;background:var(--navy);opacity:.45}
.trait-slider-track .marker{position:absolute;top:3px;bottom:3px;width:6px;margin-left:-3px;border-radius:3px;background:var(--cat-1)}
.quadrant-types-title{font-weight:800;color:var(--navy);font-size:13px;margin-bottom:12px}
.qt-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.qt-item:last-child{margin-bottom:0}
.qt-item.selected{background:#eff6ff;border-color:var(--blue)}
.qt-name{font-weight:800;color:var(--blue-dark)}
.qt-badge{display:inline-block;background:var(--blue);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.qt-desc{font-size:12px;color:var(--ink-2);line-height:1.7;margin-top:4px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.status-card{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:44px;max-width:480px;margin:60px auto;text-align:center}
.status-card h1{font-size:18px;color:var(--navy);margin:0 0 12px}
.status-card p{font-size:13px;color:var(--muted);line-height:1.8}
.page-loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--blue-dark);font-weight:bold}
.page-loading.hidden{display:none!important}
.loading-box{display:flex;flex-direction:column;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 28px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.loading-spinner{width:42px;height:42px;border:5px solid #e0f2fe;border-top-color:var(--blue);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.top-card,.panel{padding:20px}}
</style>
</head>
<body>

<div id="pageLoading" class="page-loading"><div class="loading-box"><div class="loading-spinner"></div><div>結果を読み込み中...</div></div></div>

    <h2>4分割タイプ別の役割傾向</h2>

    <div id="quadrantBox"></div>
    <div class="note">協調性・主体性の高低から見た簡易的な傾向ラベルです（実際の適性は他の項目も含めて総合的にご判断ください）。</div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { escapeHtml as esc, loadEffectiveCategory1List, loadEffectiveQuestionSet } from "./operator-shared.js";

// ---------------------------------------------------------------------
// このページについて
// 本人（受験者）に、受験直後のブラウザから自分の結果だけを開示するための画面。
// company-report-individual.html（企業管理者向けレポート）と異なり、
//  ・企業内の他の受験者のデータ（examResults / examInvites の全件）は一切取得しない
//    （自分のtoken 1件だけをgetする。firestore.rulesもそれ以外を許可していない）
//  ・全社平均・同部署平均・同役職平均と比較するレーダーチャートは表示しない
//  ・全受験者を点で並べた散布図も表示しない
// という2点を、企業管理者向けレポートとの明確な違いとしている。
// 4能力・行動特性の傾向コメントの文言（TYPE_CONCERN_PHRASE / SKILL_CONCERN_PHRASE 等）と
// 判定ロジック（classifySkillProfile / classifyPersonalityType）は、本人が読んでも
// 傷つきにくい言い回しに調整したうえで company-report-individual.html と同じ内容を
// 保持している。今後どちらかの文言を直す場合は、もう一方にも同じ修正を反映すること。
// ---------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const companyId = params.get("company");
const token = params.get("token");

function showError(title, text) {
  $("pageLoading").classList.add("hidden");
  $("errorTitle").textContent = title;
  $("errorText").textContent = text;
  $("errorArea").style.display = "block";
  $("mainArea").style.display = "none";
}

function showMain() {
  $("pageLoading").classList.add("hidden");
  $("errorArea").style.display = "none";
  $("mainArea").style.display = "block";
}

// ---------------------------------------------------------------------
// スコア計算ロジック（company-report-individual.html / company-report.htmlと同一）
// ---------------------------------------------------------------------
function isScoreableType(type) { return type === "choice" || type === "multi_select" || type === "fill_blank"; }

const FOUR_CATEGORY1_IDS = ["cognitive", "verbal", "logical_thinking", "business_exec"];
const RADAR_LABELS = { cognitive: "①認知能力", verbal: "②言語理解能力", logical_thinking: "③論理思考能力", business_exec: "④実務遂行能力" };
const PERSONALITY_SUBCATS = ["主体性", "行動傾向", "協調性", "外向性", "勤勉性・計画性", "ストレス耐性", "モチベーション", "開放性"];
const TRAIT_POLE_LABELS = {
  "主体性": { low: "協働的なタイプ", high: "主体的なタイプ" },
  "行動傾向": { low: "慎重的なタイプ", high: "行動的なタイプ" },
  "協調性": { low: "自立的なタイプ", high: "協調的なタイプ" },
  "外向性": { low: "内向的なタイプ", high: "外向的なタイプ" },
  "勤勉性・計画性": { low: "柔軟的なタイプ", high: "計画的なタイプ" },
  "ストレス耐性": { low: "繊細的なタイプ", high: "安定的なタイプ" },
  "モチベーション": { low: "マイペース的なタイプ", high: "意欲的なタイプ" },
  "開放性": { low: "安定志向的なタイプ", high: "開放的なタイプ" },
};

const TYPE_HIGH_THRESHOLD = 3;
const TYPE_OPENING = {
  "高い|高い": "自ら課題を見つけて動き出し、判断から行動までのスピードも速く、",
  "高い|低い": "自ら課題を見つけて動きますが、リスクや状況をしっかり見極めてから動く慎重なタイプで、",
  "低い|高い": "自分から方向性を決めるというより、周囲の状況や指示に反応して動くタイプで、",
  "低い|低い": "自分から積極的に動くことは少なく、指示や状況を待ってから慎重に動くタイプで、",
};
const TYPE_INTERPERSONAL = {
  "高い|高い": "周囲との調和を大切にしながら、社交的に人を巻き込んで物事を進めていきます。",
  "高い|低い": "周囲との調和を大切にしますが、前面に出るよりも裏方として静かに支えることを好みます。",
  "低い|高い": "自分の考えを大切にする独立志向を持ちながら、社交的に自分の考えを発信していきます。",
  "低い|低い": "周囲との調整よりも自分のペースを優先し、一人で抱え込みやすい面もあります。",
};
const TYPE_WORKSTYLE = {
  "高い": "計画的に段取りを組み立てるのが得意で、長期的な戦略づくりや着実な実行が求められる役割に向いています。",
  "低い": "計画よりもその場の状況に応じた柔軟さが持ち味ですが、段取りを事前に詰め切れないことがあります。",
};
const TYPE_CONCERN_ORDER = ["主体性", "行動傾向", "協調性", "外向性", "勤勉性・計画性", "ストレス耐性", "モチベーション", "開放性"];
const TYPE_CONCERN_PHRASE = {
  "主体性": "指示や目標が曖昧だと動きにくくなる",
  "行動傾向": "スピードが求められる場面で出遅れやすい",
  "協調性": "周囲との連携が後回しになり孤立しやすい",
  "外向性": "自分の考えや成果を周囲に伝える機会が少ない",
  "勤勉性・計画性": "計画性やリスク管理が手薄になりやすい",
  "ストレス耐性": "プレッシャーがかかる場面で本来の力を発揮しにくくなりやすい",
  "モチベーション": "きっかけや目的が明確でないと意欲を保ちにくい",
  "開放性": "変化や新しいやり方への対応にはやや時間がかかる",
};
const TYPE_CAUTION_ALL_HIGH = "何事にも全力で取り組むタイプなので、頑張りすぎて息切れしないよう、適度に力を抜くことも意識すると長く活躍できます。";
const TYPE_STRENGTH_ORDER = ["ストレス耐性", "モチベーション", "開放性"];
const TYPE_STRENGTH_PHRASE = {
  "ストレス耐性": "プレッシャーの下でも動じず安定した力を発揮できる",
  "モチベーション": "自ら目標を高く持って意欲的に取り組める",
  "開放性": "新しいやり方やアイデアも積極的に取り入れられる",
};

function levelOf(avg) { return avg == null ? null : (avg >= TYPE_HIGH_THRESHOLD ? "高い" : "低い"); }
function classifyPersonalityType(subcatAvg) {
  const levels = {};
  PERSONALITY_SUBCATS.forEach((s) => { levels[s] = levelOf(subcatAvg[s]); });
  if (Object.values(levels).some((v) => v == null)) return null;

  const opening = TYPE_OPENING[levels["主体性"] + "|" + levels["行動傾向"]];
  const interpersonal = TYPE_INTERPERSONAL[levels["協調性"] + "|" + levels["外向性"]];
  const workstyle = TYPE_WORKSTYLE[levels["勤勉性・計画性"]];

  const highStrengths = TYPE_STRENGTH_ORDER.filter((t) => levels[t] === "高い");
  const strengthSentence = highStrengths.length
    ? "また、" + highStrengths.map((t) => TYPE_STRENGTH_PHRASE[t]).join("、") + "点も強みです。"
    : "";

  const lowTraits = TYPE_CONCERN_ORDER.filter((t) => levels[t] === "低い");
  const concernSentence = lowTraits.length
    ? "一方で、" + lowTraits.map((t) => TYPE_CONCERN_PHRASE[t]).join("、") + "といった傾向が見られます。"
    : TYPE_CAUTION_ALL_HIGH;

  const parts = [opening + interpersonal, workstyle];
  if (strengthSentence) parts.push(strengthSentence);
  parts.push(concernSentence);
  return { description: parts.join(" "), levels };
}

const SKILL_HIGH_THRESHOLD_PCT = 60;
const SKILL_STRENGTH_PHRASE = {
  "注意力": "細部まで注意深く正確に情報を処理できる",
  "記憶力": "情報を素早く正確に記憶し活用できる",
  "語彙力": "言葉の意味を正確に理解し使い分けられる",
  "計算力": "数値を素早く正確に処理できる",
  "直観力": "規則性やパターンを素早く見抜ける",
  "言語応用力": "言葉を柔軟に組み立てて応用できる",
  "基礎推理力": "与えられた条件から筋道立てて答えを導ける",
  "構造理解力": "複雑な文章の構造を正確に読み解ける",
  "照応理解力": "指示語や省略された内容を正確に補って読める",
  "同義理解力": "表現が異なる文同士の意味の異同を正確に見極められる",
  "文章推論力": "文章から論理的に妥当な結論を導き出せる",
  "認識力": "文章の情景や状況を正確にイメージして把握できる",
  "照合力": "複数の情報を正確に照らし合わせて判断できる",
  "要点抽出力": "文章の要点を的確に見つけ出せる",
  "文脈理解力": "文脈から言葉や内容の意味を正確に読み取れる",
  "MECE": "物事を漏れなく重複なく整理できる",
  "因果関係": "原因と結果を正確に見分けられる",
  "仮説思考": "限られた情報から妥当な仮説を素早く立てられる",
  "構造化": "物事を筋道立てて構造的に整理できる",
  "問題解決": "課題解決の正しい手順を踏んで考えられる",
  "処理力": "情報を素早く正確に処理できる",
  "判断力": "状況を踏まえて適切な判断を下せる",
  "コミュニケーション力": "相手に伝わりやすい的確な表現ができる",
};
const SKILL_CONCERN_PHRASE = {
  "注意力": "確認や見直しを怠ると細部のミスを見落としやすい",
  "記憶力": "多くの情報を短時間で覚えるのはやや苦手",
  "語彙力": "言葉の意味を誤って解釈してしまう",
  "計算力": "計算のスピードや正確性にやや不安が残る",
  "直観力": "規則性やパターンの把握にやや時間がかかる",
  "言語応用力": "言葉を柔軟に組み替えて考えるのはやや苦手",
  "基礎推理力": "複数の条件を整理して結論を導くのに時間がかかる",
  "構造理解力": "複雑な構文の文章を正確に読み解くのはやや苦手",
  "照応理解力": "指示語が指す内容を正確に捉えきれない",
  "同義理解力": "表現が異なる文の意味を同じかどうか見誤る",
  "文章推論力": "文章から論理的な結論を導くのにやや時間がかかる",
  "認識力": "文章から状況を正確にイメージするのはやや苦手",
  "照合力": "複数の情報を照らし合わせて確認する際にミスが出やすい",
  "要点抽出力": "文章の要点を的確に絞り込むのにやや時間がかかる",
  "文脈理解力": "文脈をふまえた意味の読み取りにやや不安が残る",
  "MECE": "物事を漏れなく重複なく整理するのはやや苦手",
  "因果関係": "原因と結果を混同してしまう",
  "仮説思考": "限られた情報から仮説を立てるのにやや時間がかかる",
  "構造化": "物事を構造的に整理するのはやや苦手",
  "問題解決": "課題解決の手順を整理するのにやや不安が残る",
  "処理力": "情報処理のスピードや正確性にやや不安が残る",
  "判断力": "状況に応じた適切な判断にやや時間がかかる",
  "コミュニケーション力": "相手に伝わりやすい表現を整えるのはやや苦手",
};
const SKILL_STRENGTH_FALLBACK = "高い水準の力を発揮できる";
const SKILL_CONCERN_FALLBACK = "この点にはやや不安が残る";
function skillStrengthPhrase(name) { return SKILL_STRENGTH_PHRASE[name] || SKILL_STRENGTH_FALLBACK; }
function skillConcernPhrase(name) { return SKILL_CONCERN_PHRASE[name] || SKILL_CONCERN_FALLBACK; }

// （非公開＝出題対象外の問題は実際の受験では出題されないため、満点の計算からも除外する。exam.htmlの
// 「(eff.items || []).filter((i) => i.active !== false)」と同じ条件で揃えている）
function maxBySubcatForCategory1s(category1Ids) {
  const out = {};
  (category1Ids || []).forEach((category1Id) => {
    const items = Array.from((itemsByCategory1[category1Id] || new Map()).values());
    items.forEach((item) => {
      if (item.active === false) return;
      const sc = item.subcategory || "";
      if (!sc) return;
      let pts = 0;
      if (item.type === "typing_passage") pts = 10;
      else if (isScoreableType(item.type)) pts = (typeof item.score === "number" ? item.score : 1);
      else return;
      out[sc] = (out[sc] || 0) + pts;
    });
  });
  return out;
}
function subcatNamesByCategory1(category1Ids) {
  const out = {};
  (category1Ids || []).forEach((category1Id) => {
    const items = Array.from((itemsByCategory1[category1Id] || new Map()).values()).sort((x, y) => (x.order || 0) - (y.order || 0));
    const seen = new Set();
    const list = [];
    items.forEach((item) => {
      const sc = item.subcategory || "";
      if (sc && !seen.has(sc)) { seen.add(sc); list.push(sc); }
    });
    out[category1Id] = list;
  });
  return out;
}

function classifySkillProfile(a) {
  const sections = [];
  FOUR_CATEGORY1_IDS.forEach((category1Id) => {
    const names = (skillSubcatByCategory1[category1Id] || []).filter((s) => a.skillSubcat && a.skillSubcat[s]);
    if (!names.length) return;
    const high = names.filter((s) => a.skillSubcat[s].pct >= SKILL_HIGH_THRESHOLD_PCT);
    const low = names.filter((s) => a.skillSubcat[s].pct < SKILL_HIGH_THRESHOLD_PCT);
    let sentence;
    if (high.length && low.length) {
      sentence = high.map(skillStrengthPhrase).join("、") + "点が強みです。一方で、" + low.map(skillConcernPhrase).join("、") + "といった傾向が見られます。";
    } else if (high.length) {
      sentence = high.map(skillStrengthPhrase).join("、") + "点が強みで、高いレベルの力が期待できます。";
    } else {
      sentence = low.map(skillConcernPhrase).join("、") + "といった傾向が見られます。今後の経験や学習を通じた底上げが期待できます。";
    }
    sections.push({ category1Id, sentence });
  });
  if (!sections.length) return null;
  return { sections };
}

function typingErrorScore(errors) {
  const e = Math.max(0, Math.floor(Number(errors) || 0));
  return Math.max(0, 10 - e);
}
function diffTyping(sample, typed) {
  const a = sample || "", b = typed || "";
  const n = a.length, m = b.length;
  if (n === 0 && m === 0) return { matched: 0, errors: 0 };
  const dp = new Array(n + 1);
  for (let i = 0; i <= n; i++) { dp[i] = new Array(m + 1).fill(0); dp[i][0] = i; }
  for (let j = 0; j <= m; j++) dp[0][j] = j;
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1];
      else dp[i][j] = 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  let i = n, j = m, matched = 0, errors = 0;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1] && dp[i][j] === dp[i - 1][j - 1]) { matched++; i--; j--; }
    else if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + 1) { errors++; i--; j--; }
    else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) { errors++; i--; }
    else if (j > 0 && dp[i][j] === dp[i][j - 1] + 1) { errors++; j--; }
    else if (i > 0) { errors++; i--; }
    else { errors++; j--; }
  }
  return { matched, errors };
}
function typingStatsFor(entry, item) {
  if (entry.typedText != null && item && item.questionText) return diffTyping(item.questionText, entry.typedText);
  return { matched: entry.matched, errors: entry.errorCount };
}
function scoreInfoForAnswer(type, entry, item) {
  if (type === "typing_passage") {
    const stats = typingStatsFor(entry, item);
    return { earned: typingErrorScore(stats.errors), max: 10, isCorrect: null };
  }
  if (type === "likert") {
    const earned = typeof entry.score === "number" ? entry.score : (Number(entry.value) || 0);
    return { earned, max: 5, isCorrect: null };
  }
  if (isScoreableType(type)) {
    const isCorrect = entry.isCorrect === true;
    const max = item && typeof item.score === "number" ? item.score : null;
    const earned = max == null ? null : (isCorrect ? max : 0);
    return { earned, max, isCorrect };
  }
  return { earned: null, max: null, isCorrect: null };
}
function computeResultAggregate(result) {
  const byCategory1 = {};
  const bySubcat = {};
  if (result && result.parts) {
    Object.keys(result.parts).forEach((category1Id) => {
      const category1Result = result.parts[category1Id];
      const items = itemsByCategory1[category1Id];
      const answers = category1Result && category1Result.answers ? category1Result.answers : [];
      let score = 0;
      answers.forEach((entry) => {
        const item = items ? items.get(entry.itemId) : null;
        const info = scoreInfoForAnswer(entry.type, entry, item);
        if (typeof info.earned === "number") score += info.earned;
        const subcat = entry.subcategory || "";
        if (subcat) {
          if (!bySubcat[subcat]) bySubcat[subcat] = { score: 0, answeredCount: 0 };
          bySubcat[subcat].answeredCount++;
          if (typeof info.earned === "number") bySubcat[subcat].score += info.earned;
        }
      });
      byCategory1[category1Id] = { score, answeredCount: answers.length };
    });
  }
  return { byCategory1, bySubcat };
}
// 非公開＝出題対象外の問題は実際の受験では出題されないため、満点の計算からも除外する
function maxForCategory1(items) {
  return (items || []).reduce((sum, item) => {
    if (item.active === false) return sum;
    if (item.type === "typing_passage") return sum + 10;
    if (isScoreableType(item.type)) return sum + (typeof item.score === "number" ? item.score : 1);
    return sum;
  }, 0);
}

// ---------------------------------------------------------------------
// 4分割タイプ（company-report-individual.htmlの散布図パネルにある「4分割タイプ別の
// 役割傾向」と同じ4タイプ。ここでは散布図そのものは表示せず、本人の主体性・協調性の
// 高低（classifyPersonalityTypeで算出済みのlevels）だけから該当タイプを判定して示す。
// ---------------------------------------------------------------------
const QUADRANT_TYPES = [
  { key: "high|high", name: "チームドライバー型", desc: "自ら率先して動きながらも周囲との連携を大切にするタイプです。チームの旗振り役として目標に向けてメンバーを巻き込み、全体を前に進める推進力が期待できます。" },
  { key: "low|high", name: "チームハーモニー型", desc: "周囲の意見をよく聞き、場の空気や人間関係に配慮しながら物事を進めるタイプです。チーム内の潤滑油としてメンバー同士をつなぎ、居心地の良い雰囲気づくりや合意形成の場面で力を発揮します。" },
  { key: "low|low", name: "チームスタビリティ型", desc: "自分のペースで物事にじっくり取り組むタイプです。個人の作業や専門性を活かした役割で安定した成果を発揮しやすく、チームに落ち着きと着実さをもたらします。" },
  { key: "high|low", name: "チームリードメーカー型", desc: "指示を待たず自らの判断で動くタイプです。新しい課題への挑戦や前例のない状況を切り拓く場面で力を発揮し、チームに新しい流れをつくります。" },
];
function quadrantKey(levels) {
  const sub = levels["主体性"] === "高い" ? "high" : "low";
  const coop = levels["協調性"] === "高い" ? "high" : "low";
  return sub + "|" + coop;
}

// ---------------------------------------------------------------------
// 描画
// ---------------------------------------------------------------------
function renderSkillBox(a) {
  const skillProfile = classifySkillProfile(a);
  const el = $("skillBox");
  el.innerHTML = (skillProfile
    ? '<div class="type-box"><div class="type-desc">' +
      skillProfile.sections.map((s) => '<div class="skill-category1"><b>' + esc(RADAR_LABELS[s.category1Id]) + "</b>：" + esc(s.sentence) + "</div>").join("") +
      "</div></div>"
    : '<div class="note">4能力の得点データが十分でないため、傾向コメントは表示していません。</div>') +
    '<div class="bar-section-title">①〜④ 正答率</div>' +
    FOUR_CATEGORY1_IDS.map((category1Id) => {
      const v = a.category1Pct[category1Id];
      return '<div class="bar-row"><div class="label">' + esc(RADAR_LABELS[category1Id]) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + (v == null ? 0 : Math.max(0, v)) + '%"></div></div><div class="val">' + (v == null ? "-" : v + "%") + "</div></div>";
    }).join("");
}

function renderTypeBox(type) {
  const el = $("typeBox");
  el.innerHTML = type
    ? '<div class="type-box"><div class="type-desc">' + esc(type.description) + "</div></div>"
    : '<div class="note">行動特性・性格の回答が一部ないため、タイプ判定は表示していません。</div>';
}

function renderTraitSliders(a) {
  const el = $("traitSliders");
  if (!a.hasAllSubcats) { el.innerHTML = ""; return; }
  el.innerHTML = PERSONALITY_SUBCATS.map((s) => {
    const v = a.subcat[s];
    const pct = v == null ? 50 : Math.max(0, Math.min(100, Math.round(((v - 5) / 20) * 100)));
    const poles = TRAIT_POLE_LABELS[s] || { low: s, high: s };
    return '<div class="trait-slider-row">'
      + '<div class="pole-label low">' + esc(poles.low) + "</div>"
      + '<div class="trait-slider-track"><div class="mid-line"></div>' + (v == null ? "" : '<div class="marker" style="left:calc(3px + (100% - 6px) * ' + (pct / 100) + ')"></div>') + "</div>"
      + '<div class="pole-label high">' + esc(poles.high) + "</div>"
      + "</div>";
  }).join("");
}

function renderQuadrant(type) {
  const el = $("quadrantBox");
  const myKey = type ? quadrantKey(type.levels) : null;
  el.innerHTML = QUADRANT_TYPES.map((q) => {
    const isMine = q.key === myKey;
    return '<div class="qt-item' + (isMine ? " selected" : "") + '">' +
      '<span class="qt-name">' + esc(q.name) + "</span>" +
      (isMine ? '<span class="qt-badge">あなたの傾向</span>' : "") +
      '<div class="qt-desc">' + esc(q.desc) + "</div>" +
      "</div>";
  }).join("");
}

// ---------------------------------------------------------------------
// データ読み込み・認可チェック
// ---------------------------------------------------------------------
let itemsByCategory1 = {};
let category1Max = {};
let skillSubcatByCategory1 = {};
let skillSubcatMax = {};

async function loadQuestionMeta() {
  const category1List = await loadEffectiveCategory1List(companyId);
  itemsByCategory1 = {};
  await Promise.all(category1List.map(async (p) => {
    const eff = await loadEffectiveQuestionSet(companyId, p);
    const map = new Map();
    (eff.items || []).forEach((item) => map.set(item.id, item));
    itemsByCategory1[p.id] = map;
  }));
  category1Max = {};
  FOUR_CATEGORY1_IDS.forEach((category1Id) => { category1Max[category1Id] = maxForCategory1(Array.from((itemsByCategory1[category1Id] || new Map()).values())); });
  skillSubcatByCategory1 = subcatNamesByCategory1(FOUR_CATEGORY1_IDS);
  skillSubcatMax = maxBySubcatForCategory1s(FOUR_CATEGORY1_IDS);
}

function buildMe(invite, result) {
  const agg = computeResultAggregate(result);

  const category1Pct = {};
  FOUR_CATEGORY1_IDS.forEach((category1Id) => {
    const a = agg.byCategory1[category1Id];
    const max = category1Max[category1Id];
    category1Pct[category1Id] = (a && a.answeredCount && max > 0) ? Math.round((a.score / max) * 1000) / 10 : null;
  });

  const subcat = {};
  const subcatAvg = {};
  let hasAllSubcats = true;
  PERSONALITY_SUBCATS.forEach((s) => {
    const a = agg.bySubcat[s];
    if (a && a.answeredCount) {
      subcat[s] = a.score;
      subcatAvg[s] = Math.round((a.score / a.answeredCount) * 10) / 10;
    } else {
      subcat[s] = null; subcatAvg[s] = null; hasAllSubcats = false;
    }
  });

  const skillSubcat = {};
  Object.keys(skillSubcatMax).forEach((s) => {
    const a = agg.bySubcat[s];
    const max = skillSubcatMax[s];
    skillSubcat[s] = (a && a.answeredCount && max > 0) ? { score: a.score, max, pct: Math.round((a.score / max) * 1000) / 10 } : null;
  });

  return {
    applicantName: invite.applicantName || "",
    category1Pct, subcat, subcatAvg, hasAllSubcats, skillSubcat,
  };
}

async function run(user) {
  if (!companyId || !token) {
    showError("結果を確認できません", "このページを開くためのリンクが正しくありません。受験完了画面のリンクから改めてお試しください。");
    return;
  }
  if (!user) {
    showError("結果を確認できません", "この画面は、受験を完了した直後の同じブラウザでのみご覧いただけます。お手数ですが、受験完了画面から改めてアクセスしてください。");
    return;
  }
  try {
    const inviteSnap = await getDoc(doc(db, "companies", companyId, "examInvites", token));
    if (!inviteSnap.exists() || inviteSnap.data().anonUid !== user.uid) {
      showError("結果を確認できません", "この結果を表示する権限がありません。受験完了画面のリンクから改めてアクセスしてください。");
      return;
    }
    const invite = inviteSnap.data();
    if (invite.status !== "completed") {
      showError("結果はまだありません", "受験がまだ完了していないようです。受験を完了すると結果を確認できます。");
      return;
    }
    const resultSnap = await getDoc(doc(db, "companies", companyId, "examResults", token));
    if (!resultSnap.exists()) {
      showError("結果はまだありません", "結果の記録が見つかりませんでした。しばらくしてから改めてお試しください。");
      return;
    }

    await loadQuestionMeta();
    const me = buildMe(invite, resultSnap.data());
    const type = classifyPersonalityType(me.subcatAvg);

    $("greeting").textContent = (me.applicantName ? me.applicantName + "様の" : "あなたの") + "受験結果";
    renderSkillBox(me);
    renderTypeBox(type);
    renderTraitSliders(me);
    renderQuadrant(type);

    showMain();
  } catch (err) {
    console.error("exam-result load failed", err);
    showError("結果を確認できません", "受験リンクが無効です。採用ご担当者にご確認ください。");
  }
}

// onAuthStateChangedは、ページ読み込み直後にまず未確定状態（またはnull）で1回、
// 認証状態が確定した後にもう1回…と複数回発火することがある。以前はそのたびに
// run()を呼んでいたため、先に呼ばれたrun()がshowError()でエラー画面を表示した後、
// 後から呼ばれたrun()が結果の取得に成功してmainAreaを表示しても、エラー表示が
// 残ったままになり、エラーと結果が同時に見えてしまう不具合があった。
// 判定に必要な認証状態は1回確定すれば十分なため、最初の1回だけrun()を実行し、
// 以降の発火は無視する。
const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
  unsubscribeAuth();
  run(user);
});
</script>
