<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビズてす 問題管理</title>
<style>
:root{--blue:#2563eb;--blue-dark:#1d4ed8;--navy:#0f172a;--line:#e5e7eb;--bg:#f5f7fb;--muted:#64748b;--orange:#f97316}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:#111827}
.header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;margin:0;color:var(--blue-dark)}
.header .sub{font-size:12px;color:var(--muted)}
.header a.back{font-size:12px;color:var(--muted);text-decoration:none}
.wrap{max-width:1100px;margin:24px auto;padding:0 20px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.panel h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
.settings-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;align-items:end}
.form-row label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:5px}
.form-row textarea,.form-row input,.form-row select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit}
.form-row textarea{resize:vertical;min-height:56px}
button{cursor:pointer;font-family:inherit}
button.primary{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:800}
button.primary:hover{background:var(--blue-dark)}
button.ghost{background:#fff;border:1px solid #cbd5e1;color:var(--navy);border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:800}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title h2{margin:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:800;font-size:11.5px}
.qtext{max-width:360px;white-space:pre-wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge.practice{background:#fef3c7;color:#92400e}
.badge.real{background:#dbeafe;color:#1e40af}
.badge.inactive{background:#f3f4f6;color:#9ca3af}
.row-actions a,.row-actions button{font-size:11.5px;font-weight:800;color:var(--blue-dark);background:none;border:none;padding:0;margin-right:10px}
.row-actions .danger{color:#dc2626}
.stage-header{background:#f8fafc;font-weight:800;color:var(--navy);padding:8px 10px}
.empty{color:var(--muted);font-size:13px;padding:12px 0}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:26px}
.modal-box h3{margin:0 0 16px;font-size:16px;color:var(--navy)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.choice-row{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.choice-row span{font-weight:800;color:var(--blue-dark)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.copy-templates{margin-top:8px}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1 id="companyTitle">問題管理</h1>
    <div class="sub" id="companySub">読み込み中…</div>
  </div>
  <div>
    <a class="back" href="operator-invites.html" id="toInvitesLink">受験招待を発行する →</a>
    &nbsp;|&nbsp;
    <a class="back" href="operator-home.html" id="backHomeLink">← 運営ホームへ戻る</a>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabBar"></div>

  <div class="panel">
    <h2>パート設定</h2>
    <div class="settings-grid">
      <div class="form-row"><label>受験画面に表示する説明文</label><textarea id="setInstructions"></textarea></div>
      <div class="form-row"><label>練習の制限時間（秒・0=無制限）</label><input id="setPracticeTime" type="number" min="0"></div>
      <div class="form-row"><label>本番の制限時間（秒）</label><input id="setRealTime" type="number" min="0"></div>
    </div>
    <div style="margin-top:12px"><button class="primary" id="saveSettingsBtn">パート設定を保存</button></div>
    <div class="copy-templates">
      <button class="ghost" id="copyTemplateBtn">テンプレートの初期問題をこのパートにコピー</button>
      <div class="hint">既に登録済みの問題がある場合、同じIDのテンプレート問題は上書きされます。</div>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">
      <h2>問題一覧</h2>
      <button class="primary" id="addItemBtn">＋ 問題を追加</button>
    </div>
    <table>
      <thead><tr><th style="width:50px">順</th><th style="width:70px">区分</th><th style="width:110px">形式</th><th>問題文</th><th style="width:60px">配点</th><th style="width:60px">状態</th><th style="width:110px">操作</th></tr></thead>
      <tbody id="itemRows"></tbody>
    </table>
    <div id="emptyItems" class="empty" style="display:none">このパートにはまだ問題が登録されていません。</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">問題を追加</h3>
    <div class="modal-grid">
      <div class="form-row">
        <label>区分</label>
        <select id="fStage"><option value="practice">練習</option><option value="real">本番</option></select>
      </div>
      <div class="form-row">
        <label>表示順（小さい順に表示）</label>
        <input id="fOrder" type="number" value="1">
      </div>
      <div class="form-row" id="fTypeRow">
        <label>問題形式</label>
        <select id="fType"></select>
      </div>
      <div class="form-row">
        <label>配点</label>
        <input id="fScore" type="number" value="1">
      </div>
    </div>

    <div class="form-row" style="margin-bottom:14px">
      <label id="fQuestionLabel">問題文／お手本テキスト</label>
      <textarea id="fQuestionText" style="min-height:90px"></textarea>
    </div>

    <div id="choicesBlock" style="display:none">
      <label style="display:block;font-size:12px;font-weight:800;color:#0f172a;margin-bottom:8px">選択肢</label>
      <div class="choice-row"><span>A</span><input id="fChoiceA"></div>
      <div class="choice-row"><span>B</span><input id="fChoiceB"></div>
      <div class="choice-row"><span>C</span><input id="fChoiceC"></div>
      <div class="choice-row"><span>D</span><input id="fChoiceD"></div>
    </div>

    <div class="modal-grid">
      <div class="form-row" id="fAnswerRow">
        <label id="fAnswerLabel">正解</label>
        <input id="fAnswer" placeholder="例：A　／　複数選択の場合は 1,2,3 のようにカンマ区切り">
        <div class="hint" id="fAnswerHint"></div>
      </div>
      <div class="form-row">
        <label>画像URL（図形・グラフ問題用・任意）</label>
        <input id="fImageUrl">
      </div>
    </div>

    <div class="form-row" style="margin-bottom:14px">
      <label>解説（任意）</label>
      <textarea id="fExplanation"></textarea>
    </div>

    <div class="form-row" id="fIntentRow" style="margin-bottom:14px">
      <label>測定意図メモ（運営者向け・任意）</label>
      <input id="fIntent" placeholder="例：モチベーションの源泉">
    </div>

    <div class="form-row" style="margin-bottom:0">
      <label><input type="checkbox" id="fActive" checked style="width:auto;margin-right:6px">出題対象にする（オフにすると出題されません）</label>
    </div>

    <div class="modal-actions">
      <button class="ghost" id="cancelModalBtn" type="button">キャンセル</button>
      <button class="primary" id="saveItemBtn" type="button">保存する</button>
    </div>
  </div>
</div>

<script src="operator-mode.js"></script>
<script type="module">
import { auth, db, PART_IDS, PART_LABELS, PART_TYPES } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot,
  query, orderBy, serverTimestamp, addDoc,
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { copyTemplateItemsToCompany, escapeHtml } from "./operator-shared.js";

const params = new URLSearchParams(location.search);
let companyId = params.get("company");
let currentPart = "typing";
let editingItemId = null;
let unsubscribeItems = null;
let isOperatorUser = false;

const TYPE_LABELS = {
  typing_passage: "お手本テキスト",
  choice: "択一選択",
  multi_select: "複数選択",
  fill_blank: "空欄補充（記入式）",
  sentence_completion: "文章完成（自由記述）",
};

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }

  const opSnap = await getDoc(doc(db, "operators", user.uid));
  if (opSnap.exists()) {
    isOperatorUser = true;
    if (!companyId) {
      document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif'>URLに ?company=企業ID が指定されていません。運営ホームから遷移してください。</p>";
      return;
    }
  } else {
    const caSnap = await getDoc(doc(db, "companyAdmins", user.uid));
    if (!caSnap.exists() || caSnap.data().status !== "active") {
      await signOut(auth); location.href = "login.html"; return;
    }
    // 企業管理者は、URLのパラメータに関わらず必ず自社のcompanyIdで動作する
    companyId = caSnap.data().companyId;
    document.getElementById("backHomeLink").href = "company-admin-home.html";
    document.getElementById("backHomeLink").textContent = "← 企業管理者ホームへ戻る";
  }

  const companySnap = await getDoc(doc(db, "companies", companyId));
  if (!companySnap.exists()) {
    document.getElementById("companySub").textContent = "指定された企業が見つかりません。";
    return;
  }
  const companyName = companySnap.data().companyName;
  document.getElementById("companyTitle").textContent = companyName + " の問題管理";
  document.getElementById("companySub").textContent = "企業ID: " + companyId;
  document.getElementById("toInvitesLink").href = "operator-invites.html?company=" + encodeURIComponent(companyId);

  if (isOperatorUser) {
    window.BizTestOperatorMode && window.BizTestOperatorMode.renderBanner({ companyId, companyName });
  }

  renderTabs();
  await loadPart(currentPart);
});

function renderTabs() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  PART_IDS.forEach((partId) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (partId === currentPart ? " active" : "");
    btn.textContent = PART_LABELS[partId];
    btn.addEventListener("click", () => switchPart(partId));
    bar.appendChild(btn);
  });
}

async function switchPart(partId) {
  currentPart = partId;
  renderTabs();
  await loadPart(partId);
}

async function loadPart(partId) {
  const setRef = doc(db, "companies", companyId, "questionSets", partId);
  const setSnap = await getDoc(setRef);
  const settings = setSnap.exists() ? setSnap.data() : { instructions: "", practiceTimeLimitSec: 0, realTimeLimitSec: 0 };
  document.getElementById("setInstructions").value = settings.instructions || "";
  document.getElementById("setPracticeTime").value = settings.practiceTimeLimitSec || 0;
  document.getElementById("setRealTime").value = settings.realTimeLimitSec || 0;

  if (unsubscribeItems) unsubscribeItems();
  const itemsRef = collection(db, "companies", companyId, "questionSets", partId, "items");
  const q = query(itemsRef, orderBy("order", "asc"));
  unsubscribeItems = onSnapshot(q, (snap) => renderItems(snap));
}

function renderItems(snap) {
  const tbody = document.getElementById("itemRows");
  const empty = document.getElementById("emptyItems");
  tbody.innerHTML = "";
  if (snap.empty) { empty.style.display = "block"; return; }
  empty.style.display = "none";

  const items = [];
  snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
  const practice = items.filter((i) => i.stage === "practice");
  const real = items.filter((i) => i.stage === "real");

  const appendGroup = (label, group) => {
    if (!group.length) return;
    const headerRow = document.createElement("tr");
    headerRow.innerHTML = `<td colspan="7" class="stage-header">${label}（${group.length}問）</td>`;
    tbody.appendChild(headerRow);
    group.forEach((item) => tbody.appendChild(itemRow(item)));
  };
  appendGroup("練習問題", practice);
  appendGroup("本番問題", real);
}

function itemRow(item) {
  const tr = document.createElement("tr");
  const preview = (item.questionText || "").slice(0, 60) + ((item.questionText || "").length > 60 ? "…" : "");
  tr.innerHTML = `
    <td>${item.order ?? ""}</td>
    <td><span class="badge ${item.stage}">${item.stage === "practice" ? "練習" : "本番"}</span></td>
    <td>${TYPE_LABELS[item.type] || item.type}</td>
    <td class="qtext">${escapeHtml(preview)}</td>
    <td>${item.score ?? "-"}</td>
    <td>${item.active === false ? '<span class="badge inactive">非公開</span>' : "公開"}</td>
    <td class="row-actions">
      <button data-action="edit">編集</button>
      <button data-action="delete" class="danger">削除</button>
    </td>
  `;
  tr.querySelector('[data-action="edit"]').addEventListener("click", () => openModal(item));
  tr.querySelector('[data-action="delete"]').addEventListener("click", () => deleteItem(item.id));
  return tr;
}

async function deleteItem(itemId) {
  if (!confirm("この問題を削除します。よろしいですか？")) return;
  await deleteDoc(doc(db, "companies", companyId, "questionSets", currentPart, "items", itemId));
}

// ---- モーダル制御 ----
const overlay = document.getElementById("modalOverlay");

function typeOptionsForCurrentPart() {
  return PART_TYPES[currentPart];
}

function updateFormVisibility() {
  const type = document.getElementById("fType").value;
  const showChoices = type === "choice" || type === "multi_select";
  document.getElementById("choicesBlock").style.display = showChoices ? "block" : "none";
  document.getElementById("fAnswerRow").style.display = (type === "typing_passage" || type === "sentence_completion") ? "none" : "block";
  document.getElementById("fIntentRow").style.display = currentPart === "worklife" ? "block" : "none";
  document.getElementById("fAnswerHint").textContent =
    type === "multi_select" ? "複数正解の場合はカンマ区切りで入力（例：1,2,3）" :
    type === "choice" ? "A〜Dのいずれか1文字を入力" :
    type === "fill_blank" ? "記入してほしい正解の値・文字列を入力" : "";
  document.getElementById("fQuestionLabel").textContent =
    type === "typing_passage" ? "お手本テキスト" :
    type === "sentence_completion" ? "文章完成の項目文（空欄を含む形で記載）" : "問題文";
}

function openModal(item) {
  editingItemId = item ? item.id : null;
  document.getElementById("modalTitle").textContent = item ? "問題を編集" : "問題を追加";

  const typeSelect = document.getElementById("fType");
  typeSelect.innerHTML = "";
  typeOptionsForCurrentPart().forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = TYPE_LABELS[t];
    typeSelect.appendChild(opt);
  });

  document.getElementById("fStage").value = item?.stage || "real";
  document.getElementById("fOrder").value = item?.order ?? 1;
  typeSelect.value = item?.type || typeOptionsForCurrentPart()[0];
  document.getElementById("fScore").value = item?.score ?? 1;
  document.getElementById("fQuestionText").value = item?.questionText || "";
  const choices = item?.choices || [];
  const byKey = (k) => (choices.find((c) => c.key === k) || {}).text || "";
  document.getElementById("fChoiceA").value = byKey("A");
  document.getElementById("fChoiceB").value = byKey("B");
  document.getElementById("fChoiceC").value = byKey("C");
  document.getElementById("fChoiceD").value = byKey("D");
  document.getElementById("fAnswer").value = Array.isArray(item?.correctAnswer) ? item.correctAnswer.join(",") : (item?.correctAnswer || "");
  document.getElementById("fImageUrl").value = item?.imageUrl || "";
  document.getElementById("fExplanation").value = item?.explanation || "";
  document.getElementById("fIntent").value = item?.measurementIntent || "";
  document.getElementById("fActive").checked = item?.active !== false;

  updateFormVisibility();
  overlay.classList.add("show");
}

document.getElementById("fType").addEventListener("change", updateFormVisibility);
document.getElementById("addItemBtn").addEventListener("click", () => openModal(null));
document.getElementById("cancelModalBtn").addEventListener("click", () => overlay.classList.remove("show"));

document.getElementById("saveItemBtn").addEventListener("click", async () => {
  const type = document.getElementById("fType").value;
  const choices = [];
  if (type === "choice" || type === "multi_select") {
    [["A", "fChoiceA"], ["B", "fChoiceB"], ["C", "fChoiceC"], ["D", "fChoiceD"]].forEach(([key, id]) => {
      const text = document.getElementById(id).value.trim();
      if (text) choices.push({ key, text });
    });
  }
  const rawAnswer = document.getElementById("fAnswer").value.trim();
  const correctAnswer = type === "multi_select"
    ? rawAnswer.split(",").map((s) => s.trim()).filter(Boolean)
    : rawAnswer;

  const data = {
    stage: document.getElementById("fStage").value,
    order: Number(document.getElementById("fOrder").value) || 0,
    type,
    questionText: document.getElementById("fQuestionText").value,
    choices,
    correctAnswer,
    score: Number(document.getElementById("fScore").value) || 0,
    explanation: document.getElementById("fExplanation").value,
    imageUrl: document.getElementById("fImageUrl").value,
    measurementIntent: document.getElementById("fIntent").value,
    active: document.getElementById("fActive").checked,
    updatedAt: serverTimestamp(),
  };

  const itemsRef = collection(db, "companies", companyId, "questionSets", currentPart, "items");
  if (editingItemId) {
    await updateDoc(doc(itemsRef, editingItemId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(itemsRef, data);
  }
  overlay.classList.remove("show");
});

document.getElementById("saveSettingsBtn").addEventListener("click", async () => {
  const ref = doc(db, "companies", companyId, "questionSets", currentPart);
  await setDoc(ref, {
    partLabel: PART_LABELS[currentPart],
    instructions: document.getElementById("setInstructions").value,
    practiceTimeLimitSec: Number(document.getElementById("setPracticeTime").value) || 0,
    realTimeLimitSec: Number(document.getElementById("setRealTime").value) || 0,
    updatedAt: serverTimestamp(),
  }, { merge: true });
  alert("パート設定を保存しました。");
});

document.getElementById("copyTemplateBtn").addEventListener("click", async () => {
  if (!confirm("テンプレートの初期問題をこのパートにコピーします。同じIDの問題は上書きされます。よろしいですか？")) return;
  const count = await copyTemplateItemsToCompany(companyId, currentPart);
  alert(`${count}問をコピーしました。`);
});
</script>
</body>
</html>
